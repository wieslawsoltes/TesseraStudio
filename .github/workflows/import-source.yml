name: Import complete Tessera source
on:
  push:
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore checksum-verified source
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, subprocess
          parts = sorted(pathlib.Path('.github/source-payload').glob('part-*.txt'))
          assert len(parts) == 8, 'Incomplete source transfer'
          data = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert hashlib.sha256(data).hexdigest() == 'bdc33681453a22a388cd1ab7b243743008f983ae03bacdd8707c6a2896734d77', 'Source checksum mismatch'
          files = json.loads(lzma.decompress(data))
          assert len(files) == 65, 'Source file count mismatch'
          for name, content in files.items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert '.git' not in path.parts and not name.startswith('.github/workflows/')
              assert isinstance(content, str)
              target = pathlib.Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          subprocess.run(['git', 'add', '--', *files.keys()], check=True)
          subprocess.run(['git', 'rm', '--', *[str(p) for p in parts]], check=True)
          print('Restored and staged all', len(files), 'application source files.')
      - name: Commit complete app and Pages support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: import complete Tessera Studio with browser-local GitHub Pages edition'
          git push origin HEAD:main

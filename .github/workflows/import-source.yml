          '''
          copied = []
          for line in manifest.strip().splitlines():
              expected, name = line.strip().split(' ', 1)
              source = pathlib.Path('.source-template') / name
              if not source.is_file():
                  print('NOT IMPORTED (missing):', name)
                  continue
              data = source.read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != expected:
                  print('NOT IMPORTED (different bytes):', name)
                  continue
              target = pathlib.Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              copied.append(name)
          subprocess.run(['git', 'add', '--', *copied], check=True)
          print('Verified source files imported:', len(copied))
      - name: Commit verified files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'chore: recover byte-verified hosting scaffold from Tessera source manifest'
            git push origin HEAD:main
          fi
